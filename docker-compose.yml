version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collegeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collegeos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collegeos_password}
      POSTGRES_DB: ${POSTGRES_DB:-collegeos_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collegeos_user} -d ${POSTGRES_DB:-collegeos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - collegeos-network

  redis:
    image: redis:7-alpine
    container_name: collegeos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - collegeos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: collegeos-backend
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-collegeos_user}:${POSTGRES_PASSWORD:-collegeos_password}@postgres:5432/${POSTGRES_DB:-collegeos_db}?schema=public
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "false"
      CORS_ORIGINS: http://localhost:3000,http://localhost:4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - collegeos-network

volumes:
  postgres_data:
    name: collegeos_postgres_data
  redis_data:
    name: collegeos_redis_data

networks:
  collegeos-network:
    driver: bridge
